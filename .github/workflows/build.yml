name: Build

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Install universal binary tool
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Build release artifacts
        run: |
          set -euo pipefail
          version="$(./stamp.sh | awk '$1 == "STABLE_VERSION" { print $2 }')"
          mkdir -p bin
          for target in linux/amd64 linux/arm64 linux/loong64 linux/ppc64le linux/riscv64 linux/s390x darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            output="bin/bazelisk-$os-$arch"
            if [[ "$os" == windows ]]; then output="$output.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/bazelbuild/bazelisk/core.BazeliskVersion=$version" \
              -o "$output" .
          done
          "$(llvm-config --bindir)/llvm-lipo" -create -output bin/bazelisk-darwin \
            bin/bazelisk-darwin-amd64 bin/bazelisk-darwin-arm64
          for file in bin/*; do
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
          done
      - name: Sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in bin/*; do
            case "$file" in *.sha256) continue ;; esac
            printf '%s\n' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$file.sig" "$file"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: bin/*
          fail_on_unmatched_files: true
          generate_release_notes: true
